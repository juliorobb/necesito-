<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>Necesito</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--green:#16803c;--greenbg:#eaf8ef;--orange:#b45309;--orangebg:#fff7e8;--red:#b42318;--redbg:#fff0ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{border:0;border-radius:13px;padding:13px 15px;font-weight:700;cursor:pointer}input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}.app{max-width:650px;margin:auto;min-height:100vh}.top{padding:22px 18px 12px;background:var(--bg);position:sticky;top:0;z-index:5}.brand{font-size:28px;font-weight:850;letter-spacing:-1px}.sub{color:var(--muted);margin-top:2px}.content{padding:12px 16px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #00000008}.title{font-size:20px;font-weight:800;margin:0 0 6px}.muted{color:var(--muted)}.field{margin:12px 0}.field label{display:block;font-weight:700;margin:0 0 7px}.primary{background:var(--accent);color:#fff;width:100%}.secondary{background:#eef1f5;color:var(--ink)}.danger{background:var(--redbg);color:var(--red)}.success{background:var(--greenbg);color:var(--green)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.homeBtn{width:100%;margin:7px 0;text-align:left;background:#fff;border:1px solid var(--line);padding:18px}.homeBtn b{display:block;font-size:17px}.homeBtn span{display:block;color:var(--muted);margin-top:3px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800}.green{background:var(--greenbg);color:var(--green)}.orange{background:var(--orangebg);color:var(--orange)}.red{background:var(--redbg);color:var(--red)}.back{background:transparent;padding:4px 0;color:var(--muted);font-weight:700}.notice{padding:14px;border-radius:14px;margin:10px 0}.notice.green{background:var(--greenbg)}.notice.orange{background:var(--orangebg)}.notice.red{background:var(--redbg)}.bigStatus{text-align:center;padding:18px 8px}.bigStatus .emoji{font-size:38px}.bigStatus h2{margin:7px 0}.small{font-size:13px}.hidden{display:none!important}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.metric{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric .item{text-align:center}.metric b{display:block;font-size:25px}.divider{height:1px;background:var(--line);margin:14px 0}.wa{background:#16803c;color:white;width:100%}.footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body><div class="app"><div class="top"><div class="brand">Necesito</div><div class="sub">Encontrá a quien pueda resolverlo.</div></div><main id="app" class="content"></main><div class="footer">Versión de prueba · Necesito</div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,addDoc,getDoc,updateDoc,onSnapshot,query,where,serverTimestamp,runTransaction} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js';
import firebaseConfig from './firebase-config.js';
const appFb=initializeApp(firebaseConfig),auth=getAuth(appFb),db=getFirestore(appFb);const root=document.getElementById('app');
let uid=null, unsub=[]; const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const trades=['Plomero','Electricista','Gasista','Cerrajero','Técnico de aire acondicionado','Otro'];
function clear(){unsub.forEach(x=>x&&x());unsub=[]}
function shell(title,body,back=true){root.innerHTML=`${back?'<button class="back" id="back">← Volver</button>':''}<div class="card"><div class="title">${title}</div>${body}</div>`;if(back)document.getElementById('back').onclick=home}
function home(){clear();root.innerHTML=`<div class="card"><div class="bigStatus"><div class="emoji">🔎</div><h2>¿Qué necesitás?</h2><p class="muted">Te conectamos con un profesional.</p></div><button class="homeBtn" id="client">🔎 <b>Soy cliente</b><span>Necesito resolver algo.</span></button><button class="homeBtn" id="pro">🔧 <b>Soy profesional</b><span>Quiero recibir solicitudes.</span></button><button class="homeBtn" id="admin">🔐 <b>Administración</b><span>Ver operaciones e historial.</span></button></div>`;client.onclick=clientStart;pro.onclick=providerStart;admin.onclick=adminStart}
function selectTrade(id='trade'){return `<select id="${id}">${trades.map(t=>`<option>${t}</option>`).join('')}</select>`}
function clientStart(){clear();shell('Solicitar profesional',`<div class="field"><label>¿Qué necesitás?</label>${selectTrade()}</div><div class="field"><label>Zona</label><input id="zone" placeholder="Ej. Argüello"></div><div class="field"><label>¿Qué problema tenés?</label><textarea id="problem" placeholder="Contanos brevemente qué necesitás"></textarea></div><div class="field"><label>Tu nombre</label><input id="name" placeholder="Nombre"></div><div class="field"><label>Tu WhatsApp</label><input id="phone" inputmode="tel" placeholder="351... o +54 9 351..."></div><button class="primary" id="send">Solicitar profesional</button><div id="msg" class="muted small" style="margin-top:10px"></div>`);send.onclick=createRequest}
async function createRequest(){const trade=document.getElementById('trade').value,zone=document.getElementById('zone').value.trim(),problem=document.getElementById('problem').value.trim(),name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();if(!zone||!problem||!name||!phone)return msg.textContent='Completá los datos para continuar.';const r=await addDoc(collection(db,'requests'),{clientUid:uid,trade,zone,problem,clientName:name,clientPhone:phone,status:'searching',createdAt:serverTimestamp(),clientClosed:false,providerClosed:false});watchClient(r.id)}
function watchClient(id){clear();shell('Tu solicitud',`<div id="requestState"><div class="bigStatus"><div class="emoji">🟠</div><h2>Buscando profesional…</h2><p class="muted">Estamos buscando a alguien disponible.</p></div></div>`);const u=onSnapshot(doc(db,'requests',id),s=>{if(!s.exists())return;renderClientRequest(s.id,s.data())});unsub.push(u)}
function renderClientRequest(id,r){const box=document.getElementById('requestState');if(!box)return;let status=r.status==='accepted'?`<div class="notice green"><b>🟢 Profesional encontrado</b><br>${esc(r.providerName||'Profesional')} · ${esc(r.trade)}<br><span class="small">Aceptó tu solicitud. El profesional se comunicará contigo para coordinar el servicio.</span></div><div class="notice orange">⏳ Esperando contacto del profesional…</div>`:r.status==='searching'?`<div class="bigStatus"><div class="emoji">🟠</div><h2>Buscando profesional…</h2><p class="muted">Tu solicitud está activa.</p></div>`:`<div class="notice red">La solicitud terminó sin profesional asignado.</div>`;box.innerHTML=status+`<div class="item"><b>${esc(r.trade)}</b><br>${esc(r.zone)}<br><span class="muted">${esc(r.problem)}</span></div>${r.status==='accepted'?(r.clientClosed?closeInfo(r,'client'):closeForm(id,'client')):''}`}
function closeInfo(r,who){return `<div class="notice green">✓ Registraste que el servicio fue realizado por $${esc(r.clientAmount||'0')}.<br><span class="small">Podés cerrar la pantalla; el historial queda registrado.</span></div>`}
function closeForm(id,who){return `<div class="divider"></div><div class="title" style="font-size:17px">Registrar mi cierre</div><p class="muted small">Podés hacerlo aunque el profesional todavía no haya cerrado.</p><div class="field"><label>¿Cuánto pagaste finalmente?</label><input id="amount_${who}" inputmode="numeric" placeholder="Ej. 50000"></div><div class="field"><label>Observación / inconveniente (opcional)</label><textarea id="obs_${who}" placeholder="Contanos cómo fue el servicio"></textarea></div><button class="success" style="width:100%" onclick="window.closeRequest('${id}','${who}')">Confirmar servicio</button>`}
window.closeRequest=async(id,who)=>{const amount=document.getElementById('amount_'+who).value.trim();const obs=document.getElementById('obs_'+who).value.trim();if(!amount)return alert('Ingresá el importe.');const p=who==='client'?{clientClosed:true,clientAmount:amount,clientObservation:obs,clientClosedAt:serverTimestamp()}:{providerClosed:true,providerAmount:amount,providerObservation:obs,providerClosedAt:serverTimestamp()};await updateDoc(doc(db,'requests',id),p)};
function providerStart(){clear();shell('Soy profesional',`<div id="proArea"><div class="field"><label>Nombre</label><input id="pname" placeholder="Tu nombre o nombre comercial"></div><div class="field"><label>WhatsApp</label><input id="pphone" inputmode="tel" placeholder="351... o +54 9 351..."></div><div class="field"><label>Oficio</label>${selectTrade('ptrade')}</div><div class="field"><label>Zonas donde trabajás</label><input id="pzone" placeholder="Ej. Argüello, Villa Belgrano"></div><button class="primary" id="savePro">Guardar mis datos</button><div id="proMsg" class="muted small" style="margin-top:10px"></div></div>`);savePro.onclick=saveProvider}
async function saveProvider(){const data={uid,name:pname.value.trim(),phone:pphone.value.trim(),trade:ptrade.value,zones:pzone.value.trim(),connected:false,updatedAt:serverTimestamp()};if(!data.name||!data.phone||!data.zones)return proMsg.textContent='Completá todos los datos.';await setDoc(doc(db,'providers',uid),data,{merge:true});providerPanel()}
async function providerPanel(){clear();const snap=await getDoc(doc(db,'providers',uid));if(!snap.exists())return providerStart();const p=snap.data();renderProvider(p);const u=onSnapshot(doc(db,'providers',uid),s=>s.exists()&&renderProvider(s.data()));unsub.push(u)}
function renderProvider(p){root.innerHTML=`<button class="back" id="back">← Volver</button><div class="card"><div class="title">Soy profesional</div><div class="row"><div><b>${esc(p.name)}</b><br><span class="muted">${esc(p.trade)}</span></div><span class="badge ${p.connected?'green':'red'}">${p.connected?'🟢 CONECTADO':'🔴 DESCONECTADO'}</span></div><div class="item" style="margin-top:12px">Zonas: ${esc(p.zones)}</div><div class="row" style="margin-top:10px">${p.connected?'<button class="danger" id="toggle">Desconectarme</button>':'<button class="success" id="toggle">Conectarme</button>'}<button class="secondary" id="edit">Editar datos</button></div></div><div class="card"><div class="title" style="font-size:17px">Solicitudes</div><div id="proRequests"><span class="muted">Buscando solicitudes…</span></div></div>`;back.onclick=home;toggle.onclick=async()=>updateDoc(doc(db,'providers',uid),{connected:!p.connected});edit.onclick=providerStart;watchProviderRequests(p)}
function watchProviderRequests(p){const q=query(collection(db,'requests'),where('trade','==',p.trade),where('status','==','searching'));const u=onSnapshot(q,s=>{const el=document.getElementById('proRequests');if(!el)return;const arr=s.docs.filter(d=>{const r=d.data();if(!p.connected)return false;const zones=(p.zones||'').toLowerCase();return zones.split(',').some(z=>z.trim()&&r.zone.toLowerCase().includes(z.trim()))});if(!arr.length){el.innerHTML='<span class="muted">No hay solicitudes disponibles.</span>';return}el.innerHTML=arr.map(d=>{const r=d.data();return `<div class="item"><b>${esc(r.clientName)}</b> · ${esc(r.zone)}<br><span class="muted">${esc(r.problem)}</span><div class="row" style="margin-top:10px"><button class="success" onclick="window.acceptRequest('${d.id}')">Aceptar</button><button class="danger" onclick="window.rejectRequest('${d.id}')">Rechazar</button></div></div>`}).join('')});unsub.push(u)}
window.acceptRequest=async id=>{const ref=doc(db,'requests',id);try{await runTransaction(db,async tx=>{const s=await tx.get(ref);if(!s.exists()||s.data().status!=='searching')throw new Error('taken');tx.update(ref,{status:'accepted',providerUid:uid,providerName:document.querySelector('.title')?document.querySelector('.title').nextElementSibling?.querySelector('b')?.textContent||'Profesional':'Profesional'});});const ps=await getDoc(doc(db,'providers',uid));const p=ps.data();await updateDoc(ref,{providerName:p.name,providerPhone:p.phone,providerTrade:p.trade});providerPanel()}catch(e){alert('Esta solicitud ya fue tomada por otro profesional.')}};
window.rejectRequest=async id=>{const ref=doc(db,'requests',id);const s=await getDoc(ref);if(!s.exists())return;const r=s.data();const rejected=[...(r.rejectedBy||[])];if(!rejected.includes(uid))rejected.push(uid);await updateDoc(ref,{rejectedBy:rejected});}
function adminStart(){clear();shell('Administración',`<div class="notice orange">Panel interno de prueba. En producción tendrá acceso protegido.</div><div id="adminArea">Cargando…</div>`);const u=onSnapshot(collection(db,'requests'),s=>renderAdmin(s.docs.map(d=>({id:d.id,...d.data()}))));unsub.push(u);const p=onSnapshot(collection(db,'providers'),s=>{window._providers=s.docs.map(d=>({id:d.id,...d.data()}));renderAdmin(window._requests||[])});unsub.push(p)}
function renderAdmin(rs){window._requests=rs;const ps=window._providers||[];const closed=rs.filter(r=>r.clientClosed||r.providerClosed);const total=rs.reduce((a,r)=>a+(Number(r.clientAmount)||0),0);const html=`<div class="metric"><div class="item"><b>${rs.length}</b><span class="muted">Solicitudes</span></div><div class="item"><b>${ps.filter(p=>p.connected).length}</b><span class="muted">Conectados</span></div><div class="item"><b>${closed.length}</b><span class="muted">Con cierre</span></div><div class="item"><b>$${total.toLocaleString('es-AR')}</b><span class="muted">Importe declarado</span></div></div><div class="card"><div class="title" style="font-size:17px">Profesionales</div><div class="list">${ps.length?ps.map(p=>`<div class="item"><b>${esc(p.name)}</b> · ${esc(p.trade)}<br><span class="badge ${p.connected?'green':'red'}">${p.connected?'Conectado':'Desconectado'}</span><br><span class="muted small">${esc(p.zones||'')}</span></div>`).join(''):'<span class="muted">Sin profesionales.</span>'}</div></div><div class="card"><div class="title" style="font-size:17px">Operaciones e historial</div><div class="list">${rs.length?rs.slice().reverse().map(r=>`<div class="item"><b>#${esc(r.id.slice(-8))}</b> · ${esc(r.status)}<br>Cliente: ${esc(r.clientName)} · ${esc(r.zone)}<br>Profesional: ${esc(r.providerName||'—')}<br>Cliente: ${r.clientClosed?'Cerró · $'+esc(r.clientAmount):'Pendiente'}<br>Profesional: ${r.providerClosed?'Cerró · $'+esc(r.providerAmount):'Pendiente'}${r.clientClosed&&r.providerClosed?`<br><b>${Number(r.clientAmount)===Number(r.providerAmount)?'Importe coincidente':'Diferencia de importe'}</b>`:''}${r.clientObservation?`<br>Obs. cliente: ${esc(r.clientObservation)}`:''}${r.providerObservation?`<br>Obs. profesional: ${esc(r.providerObservation)}`:''}</div>`).join(''):'<span class="muted">Sin operaciones.</span>'}</div></div>`;const el=document.getElementById('adminArea');if(el)el.innerHTML=html}
onAuthStateChanged(auth,u=>{uid=u?.uid||null;if(uid)home()});signInAnonymously(auth).catch(e=>{root.innerHTML='<div class="card"><h2>No se pudo conectar</h2><p>Revisá que Autenticación anónima esté habilitada en Firebase.</p></div>'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
