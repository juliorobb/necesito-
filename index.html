// Compatibilidad: buscar perfiles creados con la versión anterior (cuyo ID era el UID anónimo) y migrarlos al ID estable del WhatsApp.
let legacy=null;for(const candidate of [phone,normPhone(phone)]){const qs=await getDocs(query(collection(db,'providers'),where('phone','==',candidate)));if(!qs.empty){legacy=qs.docs[0];break}}
if(legacy){const d=legacy.data();if(d.phone){const migrated={...d,providerId:normPhone(phone),phone:d.phone,ownerUid:uid};await setDoc(ref,{...migrated,updatedAt:serverTimestamp()},{merge:true});save(K.pro,migrated);providerPanel();return}}
document.getElementById('find').style.display='none';document.getElementById('proForm').innerHTML=`<div class="field"><label>Nombre</label><input id="pname" placeholder="Nombre o nombre comercial"></div><div class="field"><label>Oficio</label>${tradeSelect('ptrade','Plomero')}</div><button class="btn primary" id="save">Crear perfil</button>`;document.getElementById('save').onclick=()=>savePro(phone)}
async function savePro(phone){const p={providerId:normPhone(phone),name:document.getElementById('pname').value.trim(),phone:phone.trim(),trade:document.getElementById('ptrade').value,zones:'',connected:true,active:true,ownerUid:uid};if(!p.name||!p.phone){alert('Completá nombre y WhatsApp.');return}await setDoc(providerRef(phone),{...p,updatedAt:serverTimestamp()},{merge:true});save(K.pro,p);providerPanel()}
async function providerPanel(){stopProviderAlert();clearWatch();let p=load(K.pro);if(!p){professional();return}const snap=await getDoc(providerRef(p.phone));if(!snap.exists()){localStorage.removeItem(K.pro);professional();return}p={...snap.data(),providerId:snap.id};if(p.active===false){p.active=true;p.connected=false;await updateDoc(providerRef(p.phone),{active:true,connected:false,updatedAt:serverTimestamp()})}save(K.pro,p);renderProvider(p)}
function renderProvider(p){root.innerHTML=`${nav()}<button class="back" id="back">← Volver al inicio</button><section class="card"><div class="title">Soy profesional</div><div style="font-size:18px;font-weight:800">${esc(p.name)}</div><div class="muted">${esc(p.trade)}</div><div style="margin-top:10px"><span class="badge ${p.connected?'ok':'bad'}">${p.connected?'🟢 CONECTADO':'🔴 DESCONECTADO'}</span></div><div class="row" style="margin-top:12px"><button class="btn ${p.connected?'redBtn':'greenBtn'}" id="toggle">${p.connected?'Desconectarme':'Conectarme'}</button><button class="btn light" id="edit">Editar datos</button></div><button class="btn light" id="leave" style="margin-top:12px;padding:8px 11px;font-size:12px;font-weight:650;width:auto;color:#697386">Salir de la aplicación</button><button class="btn publishBtn" id="publish">📢 Publicar mi servicio</button></section><section class="card"><div class="title" style="font-size:17px">Solicitudes</div><div id="requests"><span class="muted">${p.connected?'Buscando solicitudes…':'Conectate para recibir solicitudes.'}</span></div></section>`;document.getElementById('back').onclick=home;document.getElementById('edit').onclick=()=>editPro(p);document.getElementById('toggle').onclick=async()=>{p.connected=!p.connected;p.active=true;await updateDoc(providerRef(p.phone),{connected:p.connected,active:true,updatedAt:serverTimestamp()});save(K.pro,p);renderProvider(p)};document.getElementById('leave').onclick=async()=>{if(!confirm('¿Querés salir de la aplicación?\n\nTus datos y tu estado de conexión quedarán guardados. Podés volver a entrar cuando quieras.'))return;localStorage.setItem(K.appExited,'1');home()};document.getElementById('publish').onclick=()=>publishService(p);watchProvider(p)}

function publishService(p){
  clearWatch();
  root.innerHTML=`${nav()}<button class="back" id="back">← Volver</button><section class="card"><div class="title">📢 Publicar mi servicio</div><p class="muted small">Creá un aviso listo para compartir desde el teléfono en WhatsApp, Facebook, Instagram u otra aplicación compatible.</p><div class="field"><label>Nombre</label><input id="pubName" value="${esc(p.name)}"></div><div class="field"><label>Profesión</label><input id="pubTrade" value="${esc(p.trade)}"></div><div class="field"><label>¿Qué servicios ofrecés?</label><textarea id="pubDesc" placeholder="Ej.: Reparaciones de pérdidas, griferías, instalaciones y mantenimiento."></textarea></div><div class="field"><label>Zona donde trabajás</label><input id="pubZone" value="${esc(p.zones||'Córdoba y zonas cercanas')}"></div><div class="field"><label>WhatsApp</label><input id="pubPhone" value="${esc(p.phone)}"></div><button class="btn primary" id="makePub">Crear publicación</button><div id="pubResult"></div></section>`;
  document.getElementById('back').onclick=()=>renderProvider(p);
  document.getElementById('makePub').onclick=async()=>{
    const name=document.getElementById('pubName').value.trim(),trade=document.getElementById('pubTrade').value.trim(),desc=document.getElementById('pubDesc').value.trim(),zone=document.getElementById('pubZone').value.trim(),phone=document.getElementById('pubPhone').value.trim();
    if(!name||!trade||!desc||!phone){alert('Completá nombre, profesión, servicios y WhatsApp.');return}
    const providerId=p.providerId||normPhone(phone);const publicUrl=`${location.origin}/#prof=${encodeURIComponent(providerId)}`;await updateDoc(providerRef(phone),{publicDescription:desc,publicZone:zone||'Córdoba',updatedAt:serverTimestamp()});const text=`🔧 ${name} · ${trade}\n\n${desc}\n\n📍 Zona: ${zone||'Córdoba'}\n\nEncontrame y solicitá el servicio a través de Necesito:\n${publicUrl}`;
    document.getElementById('pubResult').innerHTML=`<div class="title" style="font-size:17px;margin-top:18px">Vista previa</div><div class="publishPreview" id="pubText">${esc(text)}</div><div class="shareRow"><button class="btn greenBtn" id="sharePub">📤 Compartir</button><button class="btn light" id="copyPub">📋 Copiar texto</button></div><p class="muted small" style="margin-top:10px">El aviso no publica el WhatsApp del profesional: lleva a su ficha dentro de Necesito para que el contacto pase por la plataforma.</p>`;
    document.getElementById('sharePub').onclick=async()=>{try{if(navigator.share){await navigator.share({title:`${name} · ${trade}`,text})}else{await navigator.clipboard.writeText(text);alert('Texto copiado. Pegalo donde quieras publicarlo.')}}catch(e){if(e?.name!=='AbortError'){try{await navigator.clipboard.writeText(text);alert('Texto copiado. Pegalo donde quieras publicarlo.')}catch{alert('No se pudo abrir el menú de compartir.')}}}};
    document.getElementById('copyPub').onclick=async()=>{try{await navigator.clipboard.writeText(text);alert('Publicación copiada. Ahora podés pegarla en Facebook, WhatsApp o donde quieras.')}catch{alert('No se pudo copiar automáticamente. Seleccioná y copiá el texto de la vista previa.')}};
  };
}

async function publicProfile(id){clearWatch();window.__targetProviderId=id;try{const snap=await getDoc(doc(db,'providers',id));if(!snap.exists()){window.__targetProviderId='';root.innerHTML=`${nav()}<section class="card"><div class="status bad">No encontramos ese profesional.</div></section>`;return}const p=snap.data();root.innerHTML=`${nav()}<button class="back" id="back">← Volver</button><section class="card"><div class="title">${esc(p.name||'Profesional')}</div><div class="muted">${esc(p.trade||'')}</div>${p.publicDescription?`<p style="margin-top:14px">${esc(p.publicDescription)}</p>`:''}<div class="status blue small">📍 Zona: ${esc(p.publicZone||p.zones||'Córdoba')}</div><button class="btn greenBtn" id="requestPro">Solicitar a ${esc(p.name||'este profesional')}</button><p class="muted small" style="margin-top:10px">El contacto se realiza a través de Necesito. El número personal no se publica.</p></section>`;document.getElementById('back').onclick=home;document.getElementById('requestPro').onclick=()=>{window.__targetProviderId=id;client()}}catch(e){window.__targetProviderId='';root.innerHTML=`${nav()}<section class="card"><div class="status bad">No se pudo cargar el profesional.</div></section>`}}

function editPro(p){root.innerHTML=`<button class="back" id="back">← Volver</button><section class="card"><div class="title">Editar mis datos</div><div class="field"><label>Nombre</label><input id="pname" value="${esc(p.name)}"></div><div class="field"><label>WhatsApp</label><input id="pphone" value="${esc(p.phone)}"></div><div class="field"><label>Oficio</label>${tradeSelect('ptrade',p.trade)}</div><button class="btn primary" id="saveEdit">Guardar cambios</button></section>`;document.getElementById('back').onclick=providerPanel;document.getElementById('saveEdit').onclick=async()=>{p={...p,name:document.getElementById('pname').value.trim(),phone:document.getElementById('pphone').value.trim(),trade:document.getElementById('ptrade').value,zones:''};await setDoc(providerRef(p.phone),p,{merge:true});save(K.pro,p);providerPanel()}}
function watchProvider(p){clearWatch();stopProviderAlert();providerAlertPrimed=false;providerSeenRequests=new Set();if(!p.connected)return;const q=query(collection(db,'requests'),where('trade','==',p.trade),where('status','in',['searching','accepted']));const u=onSnapshot(q,s=>{const el=document.getElementById('requests');if(!el)return;const rows=s.docs.filter(d=>{const r=d.data(),pid=p.providerId||normPhone(p.phone);if(r.runId!==runId())return false;if(r.targetProviderId&&r.targetProviderId!==pid)return false;if(r.status==='accepted'&&r.providerId!==pid)return false;if(r.status==='accepted'&&r.providerClosed)return false;if((r.rejectedBy||[]).includes(pid))return false;return true});const searchingIds=new Set(rows.filter(d=>d.data().status==='searching').map(d=>d.id));if(providerAlertPrimed){let isNew=false;for(const id of searchingIds)if(!providerSeenRequests.has(id)){isNew=true;break}if(isNew)startProviderAlert(p.name)}else{providerAlertPrimed=true;if(searchingIds.size)startProviderAlert(p.name)}providerSeenRequests=searchingIds;if(!rows.some(d=>d.data().status==='searching'))stopProviderAlert();if(!rows.length){el.innerHTML='<span class="muted">🟢 Conectado · Esperando nuevas solicitudes.</span>';return}el.innerHTML=rows.map(d=>{const r=d.data();if(r.status==='accepted')return `<div class="item"><b>🟢 Solicitud aceptada</b><p style="margin:7px 0"><b>${esc(r.clientName)}</b><br>${esc(r.problem)}</p><button class="btn greenBtn" onclick="contact('${encodeURIComponent(r.clientPhone||'')}','${encodeURIComponent(r.clientName||'')}')">📱 Contactar a ${esc(r.clientName)}</button>${r.providerClosed?'<div class="status ok small">✓ Cierre registrado.</div>':`<div class="item" style="margin-top:10px"><b>Registrar cierre</b><div class="field"><label>Observación (opcional)</label><textarea id="po_${d.id}"></textarea></div><button class="btn greenBtn" onclick="closeProvider('${d.id}')">Cerrar operación</button></div>`}</div>`;return `<div class="item"><b>🔔 Nueva solicitud</b><p style="margin:7px 0"><b>${esc(r.clientName)}</b><br>${esc(r.problem)}</p><div class="row"><button class="btn greenBtn" onclick="accept('${d.id}')">Aceptar</button><button class="btn redBtn" onclick="reject('${d.id}')">Rechazar</button></div></div>`}).join('')},()=>{const el=document.getElementById('requests');if(el)el.innerHTML='<span class="muted">No se pudieron cargar las solicitudes.</span>'});stop.push(u)}
const accepting=new Set();window.accept=async id=>{if(accepting.has(id))return;accepting.add(id);const btn=document.querySelector(`button[onclick="accept('${id}')"]`);if(btn){btn.disabled=true;btn.textContent='Aceptando…';}try{const p=load(K.pro),providerId=p?.providerId||normPhone(p?.phone);await runTransaction(db,async tx=>{const ref=doc(db,'requests',id),s=await tx.get(ref);if(!s.exists()||s.data().status!=='searching')throw new Error('already');tx.update(ref,{status:'accepted',providerId,providerUid:uid,providerName:p?.name||'',providerPhone:p?.phone||''})});await providerPanel()}catch(e){if(e?.message==='already')alert('La solicitud ya fue aceptada por otro profesional.');else alert('No se pudo aceptar la solicitud. Intentá nuevamente.');await providerPanel()}finally{accepting.delete(id)}};
window.reject=async id=>{stopProviderAlert();const s=await getDoc(doc(db,'requests',id));if(!s.exists())return;const p=load(K.pro),providerId=p?.providerId||normPhone(p?.phone),a=[...(s.data().rejectedBy||[])];if(!a.includes(providerId))a.push(providerId);await updateDoc(doc(db,'requests',id),{rejectedBy:a})};
window.contact=(phone,name)=>{const n=normPhone(decodeURIComponent(phone));const p=load(K.pro);location.href='https://wa.me/'+n+'?text='+encodeURIComponent(`Hola ${decodeURIComponent(name)}, soy ${p?.name||'el profesional'}. Te contacto por tu solicitud en Necesito.`)};
window.closeProvider=async id=>{const obs=document.getElementById('po_'+id)?.value.trim()||'';const snap=await getDoc(doc(db,'requests',id));if(!snap.exists())return;const r=snap.data();const data={providerClosed:true,providerObservation:obs,providerClosedAt:serverTimestamp()};if(r.clientClosed)data.status='completed';await updateDoc(doc(db,'requests',id),data);providerPanel()};
function admin(){clearWatch();const pin=prompt('PIN de administración de prueba');if(pin!=='Necesito2026'){home();return}root.innerHTML=`${nav()}<button class="back" id="back">← Volver al inicio</button><section class="card"><div class="title">Administración</div><p class="muted small">Panel interno de prueba.</p><div class="title" style="font-size:17px;margin-top:15px">Profesionales</div><div id="pros">Cargando…</div></section><section class="card"><div class="title" style="font-size:17px">Solicitudes</div><div id="adminReq">Cargando…</div></section>`;document.getElementById('back').onclick=home;const u1=onSnapshot(collection(db,'providers'),s=>{const el=document.getElementById('pros');if(!el)return;el.innerHTML=s.docs.map(d=>{const p=d.data();return `<div class="item"><b>${esc(p.name||'Sin nombre')}</b> · ${esc(p.trade||'')}<br><span class="badge ${p.active===false?'bad':(p.connected?'ok':'bad')}">${p.active===false?'⚪ INACTIVO':(p.connected?'🟢 CONECTADO':'🔴 DESCONECTADO')}</span><br><span class="small">${esc(p.phone||'')}</span></div>`}).join('')||'Sin profesionales registrados.'});const u2=onSnapshot(collection(db,'requests'),s=>{const el=document.getElementById('adminReq');if(!el)return;el.innerHTML=s.docs.map(d=>{const r=d.data();return `<div class="item"><b>${esc(r.clientName||'')}</b> · ${esc(r.trade||'')}<br>${esc(r.problem||'')}<br>Estado: <b>${esc(r.status||'')}</b>${r.providerName?`<br>Profesional: ${esc(r.providerName)}`:''}${r.clientObservation?`<br>Obs. cliente: ${esc(r.clientObservation)}`:''}${r.providerObservation?`<br>Obs. profesional: ${esc(r.providerObservation)}`:''}</div>`}).join('')||'Sin solicitudes.'});stop.push(u1,u2)}
// Exponer las funciones de navegación porque este script usa type="module" y los onclick del HTML no acceden al scope del módulo.
Object.assign(window,{home,client,professional,admin,publicProfile,activity,favorites,menu,welcome,authScreen,tutorial});
async function start(){if(!auth.currentUser)await signInAnonymously(auth)}onAuthStateChanged(auth,u=>{if(u){uid=u.uid;const m=location.hash.match(/^#prof=(.+)$/);if(m)publicProfile(decodeURIComponent(m[1]));else if(!localStorage.getItem('nec_onboarding_seen'))welcome();else home()}});start().catch(()=>root.innerHTML='<section class="card"><div class="status bad">No se pudo conectar con Firebase.</div></section>');
</script></body></html>
