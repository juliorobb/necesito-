<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),root=document.getElementById('app');
let uid=null,stop=[]; const K={pro:'nec_pro',client:'nec_client',active:'nec_active',appExited:'nec_app_exited',run:'nec_test_run'};
const runId=()=>{let r=localStorage.getItem(K.run);if(!r){r='run_'+Date.now()+'_'+Math.random().toString(36).slice(2);localStorage.setItem(K.run,r)}return r};

let audioCtx=null,providerAlertTimer=null,providerVoiceTimer=null,providerAlertActive=false,providerAlertPrimed=false,providerSeenRequests=new Set(),clientAlertedRequestId=null;
function unlockAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}
function beep(freq=880,duration=.12,delay=0,volume=.18){try{unlockAudio();if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}catch{}}
function clientFoundAlert(){unlockAudio();beep(880,.11,0);beep(1320,.16,.13)}
function stopProviderAlert(){providerAlertActive=false;if(providerAlertTimer){clearInterval(providerAlertTimer);providerAlertTimer=null}if(providerVoiceTimer){clearInterval(providerVoiceTimer);providerVoiceTimer=null}try{if(window.speechSynthesis)window.speechSynthesis.cancel()}catch{}}
function speakProviderAlert(name){try{if(!('speechSynthesis' in window))return;const text=`${name||'Profesional'}, tenés una nueva solicitud.`;const voices=window.speechSynthesis.getVoices();const es=voices.filter(v=>/^es(-|_)/i.test(v.lang));const voice=es.find(v=>/google|microsoft|natural|premium/i.test(v.name))||es.find(v=>/male|hombre|mascul/i.test(v.name))||es[0];const u=new SpeechSynthesisUtterance(text);u.lang=voice?.lang||'es-AR';if(voice)u.voice=voice;u.rate=.95;u.pitch=.88;u.volume=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch{}}
function startProviderAlert(name){if(providerAlertActive)return;providerAlertActive=true;unlockAudio();const ring=()=>{beep(740,.11,0,.36);beep(980,.12,.14,.36);beep(740,.11,.30,.36)};ring();speakProviderAlert(name);providerAlertTimer=setInterval(ring,1800);providerVoiceTimer=setInterval(()=>speakProviderAlert(name),15000)}

const normPhone=v=>{let n=String(v||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('549'))return n;if(n.startsWith('54'))return '549'+n.slice(2).replace(/^9/,'');if(n.startsWith('0'))n=n.slice(1);return '549'+n};

function nav(active=""){const items=[["home","⌂","Inicio"],["activity","⚒","Actividad"],["favorites","♡","Favoritos"],["menu","☰","Menú"]];return `<nav class="main-nav" aria-label="Navegación principal">${items.map(([id,ico,label])=>`<button class="btn nav-item ${active===id?"is-active":""}" onclick="${id}()" aria-label="${label}" ${active===id?"aria-current=page":""}><span class="nav-icon">${ico}</span><span>${label}</span></button>`).join("")}</nav>`}
function home(){
  clearWatch();
  const p=load(K.pro),a=load(K.active);
  const proStatus=p?(load(K.appExited)?'Perfil guardado · '+esc(p.name):(esc(p.name)+' · '+(p.connected?'Disponible para recibir trabajos':'No disponible ahora'))):'Creá tu perfil y empezá a ofrecer tus servicios.';

    <section class="home-intro">

      <h1>¿Qué necesitás resolver hoy?</h1>

function activity(){clearWatch();const a=load(K.active),c=load(K.client)||{},p=load(K.pro)||{};root.innerHTML=`${nav("activity")}<section class="card"><div class="section-kicker">MOVIMIENTOS</div><div class="title">Actividad</div><p class="muted">Consultá tus solicitudes y trabajos desde el perfil que corresponda.</p>${a?`<div class="activity-state"><b>Tenés una solicitud en curso</b><span>${esc(a.trade||"Servicio solicitado")}</span></div>`:`<div class="empty-state"><div class="empty-icon">◷</div><b>Todavía no hay actividad para mostrar</b><span>Cuando solicites un servicio o recibas una oportunidad, aparecerá acá.</span></div>`}</section><section class="card"><div class="title" style="font-size:17px">Acceder a mis operaciones</div><button class="menu-link" onclick="client()">Solicitudes como cliente<small>${c.name?`Perfil de ${esc(c.name)}`:"Crear o completar tu perfil de cliente"}</small></button><button class="menu-link" onclick="professional()">Solicitudes como profesional<small>${p.name?`Perfil de ${esc(p.name)}`:"Crear o recuperar tu perfil profesional"}</small></button></section>`}
function favorites(){clearWatch();let saved=[];try{saved=JSON.parse(localStorage.getItem("nec_favorites")||"[]")}catch{}root.innerHTML=`${nav("favorites")}<section class="card"><div class="section-kicker">TU LISTA PERSONAL</div><div class="title">Favoritos</div>${saved.length?saved.map(x=>`<div class="item"><b>${esc(x.name||"Profesional")}</b><br><span class="small muted">${esc(x.trade||"")}</span></div>`).join(""):`<div class="empty-state"><div class="empty-icon">♡</div><b>Todavía no guardaste profesionales</b><span>Cuando exploremos el catálogo y los perfiles profesionales, vas a poder guardar tus preferidos acá.</span></div>`}</section>`}

async function client(){clearWatch();let c=load(K.client)||{},active=load(K.active);if(active){watchClient(active);return}const savedPhone=localStorage.getItem('nec_client_phone')||c.phone||'';if(savedPhone){try{const snap=await getDoc(clientRef(savedPhone));if(snap.exists()){c={...snap.data(),phone:snap.data().phone||savedPhone};save(K.client,c)}}catch(e){console.warn(e)}}const hasClient=!!((c.name||'').trim()&&(c.phone||'').trim());root.innerHTML=`${nav()}<button class="back" id="back">← Volver al inicio</button><section class="card"><div class="title">¿Qué necesitás resolver?</div>${hasClient?'':`<div class="field"><label>Tu nombre</label><input id="cname" placeholder="Nombre"></div><div class="field"><label>WhatsApp</label><input id="cphone" inputmode="tel" placeholder="351... o +54..."></div><button class="btn primary" id="nextClient">Siguiente</button>`}<div id="problemBlock" style="${hasClient?'':'display:none'}"><div class="field"><label>¿Qué necesitás?</label><textarea id="problem" placeholder="Ej.: Se me rompió el grifo de la cocina."></textarea></div><div class="status blue small">${hasClient?`Tus datos guardados: <b>${esc(c.name)}</b> · ${esc(c.phone)}`:'Tus datos se guardarán para las próximas solicitudes.'}</div><button class="btn primary" id="searchBtn">Buscar profesional</button><div id="tradePicker" class="hidden" style="margin-top:16px"><div class="title" style="font-size:17px">¿Qué profesional necesitás?</div><div class="muted small" style="margin-bottom:10px">Elegí una opción disponible.</div><div id="availabilityList"></div></div><div id="err" class="small muted" style="margin-top:10px"></div></div></section>`;document.getElementById('back').onclick=home;if(hasClient){document.getElementById('searchBtn').onclick=showProfessionals;watchClientAvailability();return}document.getElementById('nextClient').onclick=async()=>{const name=document.getElementById('cname').value.trim(),phone=document.getElementById('cphone').value.trim();if(!name||!phone){alert('Completá tu nombre y WhatsApp.');return}const data={name,phone,ownerUid:uid,updatedAt:serverTimestamp()};await setDoc(clientRef(phone),data,{merge:true});save(K.client,{name,phone});localStorage.setItem('nec_client_phone',phone);const b=document.getElementById('problemBlock');b.style.display='block';b.innerHTML=`<div class="field"><label>¿Qué necesitás?</label><textarea id="problem" placeholder="Ej.: Se me rompió el grifo de la cocina."></textarea></div><div class="status blue small">Tus datos quedaron guardados para las próximas solicitudes.</div><button class="btn primary" id="searchBtn">Buscar profesional</button><div id="tradePicker" class="hidden" style="margin-top:16px"><div class="title" style="font-size:17px">¿Qué profesional necesitás?</div><div class="muted small" style="margin-bottom:10px">Elegí una opción disponible.</div><div id="availabilityList"></div></div><div id="err" class="small muted" style="margin-top:10px"></div>`;document.getElementById('searchBtn').onclick=showProfessionals;watchClientAvailability()}}

function renderAvailability(providers){const list=document.getElementById('availabilityList');if(!list)return;const target=window.__targetProviderId||'';const targetPro=target?providers.find(p=>(p.providerId||'')===target):null;const pool=targetPro?[targetPro]:providers;const available=t=>pool.some(p=>p.trade===t&&p.active!==false&&p.connected===true);list.innerHTML=trades.map(t=>{const ok=available(t);const label=target&&targetPro&&targetPro.trade===t&&ok?`🟢 Disponible · ${esc(targetPro.name||'Profesional')}`:(ok?'🟢 Disponible':'🔴 No disponible');return `<button type="button" class="tradeChoice ${ok?'availableChoice':''}" data-trade="${esc(t)}" ${ok?'':'disabled'}><span class="tradeIcon">${tradeIcon(t)}</span><span class="tradeInfo"><b>${esc(t)}</b><span class="tradeStatus ${ok?'available':'unavailable'}">${label}</span></span></button>`}).join('');list.querySelectorAll('.tradeChoice:not(:disabled)').forEach(b=>b.onclick=()=>selectTrade(b.dataset.trade))}
function updateClientAvailability(){if(window.__providersAvailability)renderAvailability(window.__providersAvailability)}
function watchClientAvailability(){const u=onSnapshot(collection(db,'providers'),s=>{window.__providersAvailability=s.docs.map(d=>({...d.data(),providerId:d.id}));renderAvailability(window.__providersAvailability)},()=>{});stop.push(u)}
function showProfessionals(){const c=load(K.client)||{},name=((document.getElementById('cname')?.value)||c.name||'').trim(),phone=((document.getElementById('cphone')?.value)||c.phone||'').trim(),problem=document.getElementById('problem').value.trim(),err=document.getElementById('err');if(!name||!phone){err.textContent='Completá tu nombre y WhatsApp para continuar.';return}if(!problem){err.textContent='Primero describí qué necesitás resolver.';return}save(K.client,{...c,name,phone});localStorage.setItem('nec_client_phone',phone);document.getElementById('searchBtn').style.display='none';document.getElementById('tradePicker').classList.remove('hidden');err.textContent='';requestAnimationFrame(()=>document.getElementById('tradePicker')?.scrollIntoView({behavior:'smooth',block:'start'}))}
async function selectTrade(trade){const c=load(K.client)||{},name=(c.name||'').trim(),phone=(c.phone||'').trim(),problem=document.getElementById('problem').value.trim(),err=document.getElementById('err'),target=window.__targetProviderId||'';if(!problem||!name||!phone){err.textContent='Falta describir el problema o cargar tus datos.';return}try{const ps=await getDocs(query(collection(db,'providers'),where('trade','==',trade)));const availableDocs=ps.docs.filter(d=>{const p=d.data();return p.active!==false&&p.connected===true&&(!target||d.id===target)});if(!availableDocs.length){err.textContent='Ese profesional ya no está disponible. Elegí otra opción.';updateClientAvailability();return}save(K.client,{...c,name,phone,trade});localStorage.setItem('nec_client_phone',phone);await setDoc(clientRef(phone),{name,phone,ownerUid:uid,updatedAt:serverTimestamp()},{merge:true});const r=await addDoc(collection(db,'requests'),{runId:runId(),clientUid:uid,clientName:name,clientPhone:phone,trade,zone:'',problem,status:'searching',targetProviderId:target||null,providerUid:null,providerName:null,providerPhone:null,rejectedBy:[],clientClosed:false,providerClosed:false,createdAt:serverTimestamp()});window.__targetProviderId='';save(K.active,r.id);watchClient(r.id)}catch(e){console.error(e);err.textContent='No se pudo enviar la solicitud. Verificá la conexión.'}}
function watchClient(id){clearWatch();root.innerHTML=`<button class="back" id="homeBack">← Volver al inicio</button><section class="card"><div id="clientState"><div class="status warn"><b>🟠 Buscando profesional…</b><br><span class="small">Tu solicitud quedó guardada. Podés salir y volver sin perderla.</span></div></div></section>`;document.getElementById('homeBack').onclick=home;const u=onSnapshot(doc(db,'requests',id),s=>{if(!s.exists())return;renderClient(id,s.data())},()=>{const x=document.getElementById('clientState');if(x)x.innerHTML='<div class="status bad">No se pudo actualizar la solicitud.</div>'});stop.push(u)}
function renderClient(id,r){const x=document.getElementById('clientState');if(!x)return;if(r.status==='completed'||r.clientClosed){x.innerHTML=`<div class="status ok"><b>✓ Operación cerrada</b><br><span class="small">Tu parte quedó registrada.</span></div><button class="btn greenBtn" id="newReq">Nueva solicitud</button>`;document.getElementById('newReq').onclick=()=>{localStorage.removeItem(K.active);client()};return}let html='';if(r.status==='searching')html=`<div class="status warn"><b>🟠 Buscando profesional…</b><br><span class="small">La solicitud fue enviada y está esperando aceptación.</span></div>`;else if(r.status==='accepted'){if(clientAlertedRequestId!==id){clientAlertedRequestId=id;clientFoundAlert()}html=`<div class="status ok"><b>🟢 Solicitud aceptada</b><br><span class="small">${esc(r.providerName||'El profesional')} recibió tu solicitud y va a comunicarse con vos para coordinar el servicio.</span></div>`}else html=`<div class="status bad"><b>Solicitud finalizada</b></div>`;html+=`<div class="item"><b>${esc(r.trade)}</b><p style="margin:8px 0 0">${esc(r.problem)}</p></div>`;if(r.status==='accepted'&&!r.clientClosed)html+=closeBlock(id,'client');if(r.clientClosed)html+=`<div class="status ok small">✓ Registraste el cierre de tu parte.</div>`;x.innerHTML=html}
function closeBlock(id,who){return `<div class="item"><b>Registrar cierre</b><div class="field"><label>Observación (opcional)</label><textarea id="obs_${who}" placeholder="Observación"></textarea></div><button class="btn greenBtn" id="close_${who}">Cerrar operación</button></div>`}
async function closeReq(id,who){const obs=document.getElementById('obs_'+who)?.value.trim()||'';const ref=doc(db,'requests',id),snap=await getDoc(ref);if(!snap.exists())return;const r=snap.data();const data=who==='client'?{clientClosed:true,clientObservation:obs,clientClosedAt:serverTimestamp()}:{providerClosed:true,providerObservation:obs,providerClosedAt:serverTimestamp()};if((who==='client'&&r.providerClosed)||(who==='provider'&&r.clientClosed))data.status='completed';await updateDoc(ref,data);if(who==='client'){localStorage.removeItem(K.active);client()}else providerPanel()}
document.addEventListener('click',e=>{if(e.target.id==='close_client'){const id=load(K.active);if(id)closeReq(id,'client')}});
async function professional(){clearWatch();localStorage.removeItem(K.appExited);let cached=load(K.pro);if(!cached){try{const qs=await getDocs(query(collection(db,'providers'),where('ownerUid','==',uid)));if(!qs.empty){cached={...qs.docs[0].data(),providerId:qs.docs[0].id};save(K.pro,cached)}}catch(e){console.warn(e)}}if(cached){const snap=await getDoc(providerRef(cached.phone));if(snap.exists()){let d=snap.data();if(d.active===false){d={...d,active:true,connected:false};await updateDoc(providerRef(cached.phone),{active:true,connected:false,updatedAt:serverTimestamp()})}save(K.pro,{...d,providerId:snap.id});return renderProvider({...d,providerId:snap.id})}}root.innerHTML=`<button class="back" id="back">← Volver al inicio</button><section class="card"><div class="title">Soy profesional</div><p class="muted small">Ingresá tu WhatsApp. Si ya tenés perfil, recuperamos tus datos. Si no, podés crear uno.</p><div class="field"><label>WhatsApp</label><input id="pphone" inputmode="tel" placeholder="351... o +54..."></div><button class="btn primary" id="find">Continuar</button><div id="proForm"></div></section>`;document.getElementById('back').onclick=home;document.getElementById('find').onclick=findOrCreatePro}
async function findOrCreatePro(){const phone=document.getElementById('pphone').value.trim();if(!phone){alert('Ingresá tu WhatsApp.');return}const ref=providerRef(phone),snap=await getDoc(ref);if(snap.exists()){const d=snap.data();save(K.pro,{...d,providerId:snap.id});providerPanel();return}
// Compatibilidad: buscar perfiles creados con la versión anterior (cuyo ID era el UID anónimo) y migrarlos al ID estable del WhatsApp.
let legacy=null;for(const candidate of [phone,normPhone(phone)]){const qs=await getDocs(query(collection(db,'providers'),where('phone','==',candidate)));if(!qs.empty){legacy=qs.docs[0];break}}
if(legacy){const d=legacy.data();if(d.phone){const migrated={...d,providerId:normPhone(phone),phone:d.phone,ownerUid:uid};await setDoc(ref,{...migrated,updatedAt:serverTimestamp()},{merge:true});save(K.pro,migrated);providerPanel();return}}
document.getElementById('find').style.display='none';document.getElementById('proForm').innerHTML=`<div class="field"><label>Nombre</label><input id="pname" placeholder="Nombre o nombre comercial"></div><div class="field"><label>Oficio</label>${tradeSelect('ptrade','Plomero')}</div><button class="btn primary" id="save">Crear perfil</button>`;document.getElementById('save').onclick=()=>savePro(phone)}
async function savePro(phone){const p={providerId:normPhone(phone),name:document.getElementById('pname').value.trim(),phone:phone.trim(),trade:document.getElementById('ptrade').value,zones:'',connected:true,active:true,ownerUid:uid};if(!p.name||!p.phone){alert('Completá nombre y WhatsApp.');return}await setDoc(providerRef(phone),{...p,updatedAt:serverTimestamp()},{merge:true});save(K.pro,p);providerPanel()}
async function providerPanel(){stopProviderAlert();clearWatch();let p=load(K.pro);if(!p){professional();return}const snap=await getDoc(providerRef(p.phone));if(!snap.exists()){localStorage.removeItem(K.pro);professional();return}p={...snap.data(),providerId:snap.id};if(p.active===false){p.active=true;p.connected=false;await updateDoc(providerRef(p.phone),{active:true,connected:false,updatedAt:serverTimestamp()})}save(K.pro,p);renderProvider(p)}
function renderProvider(p){root.innerHTML=`${nav()}<button class="back" id="back">← Volver al inicio</button><section class="card"><div class="title">Soy profesional</div><div style="font-size:18px;font-weight:800">${esc(p.name)}</div><div class="muted">${esc(p.trade)}</div><div style="margin-top:10px"><span class="badge ${p.connected?'ok':'bad'}">${p.connected?'🟢 CONECTADO':'🔴 DESCONECTADO'}</span></div><div class="row" style="margin-top:12px"><button class="btn ${p.connected?'redBtn':'greenBtn'}" id="toggle">${p.connected?'Desconectarme':'Conectarme'}</button><button class="btn light" id="edit">Editar datos</button></div><button class="btn light" id="leave" style="margin-top:12px;padding:8px 11px;font-size:12px;font-weight:650;width:auto;color:#697386">Salir de la aplicación</button><button class="btn publishBtn" id="publish">📢 Publicar mi servicio</button></section><section class="card"><div class="title" style="font-size:17px">Solicitudes</div><div id="requests"><span class="muted">${p.connected?'Buscando solicitudes…':'Conectate para recibir solicitudes.'}</span></div></section>`;document.getElementById('back').onclick=home;document.getElementById('edit').onclick=()=>editPro(p);document.getElementById('toggle').onclick=async()=>{p.connected=!p.connected;p.active=true;await updateDoc(providerRef(p.phone),{connected:p.connected,active:true,updatedAt:serverTimestamp()});save(K.pro,p);renderProvider(p)};document.getElementById('leave').onclick=async()=>{if(!confirm('¿Querés salir de la aplicación?\n\nTus datos y tu estado de conexión quedarán guardados. Podés volver a entrar cuando quieras.'))return;localStorage.setItem(K.appExited,'1');home()};document.getElementById('publish').onclick=()=>publishService(p);watchProvider(p)}

function publishService(p){
  clearWatch();
  root.innerHTML=`${nav()}<button class="back" id="back">← Volver</button><section class="card"><div class="title">📢 Publicar mi servicio</div><p class="muted small">Creá un aviso listo para compartir desde el teléfono en WhatsApp, Facebook, Instagram u otra aplicación compatible.</p><div class="field"><label>Nombre</label><input id="pubName" value="${esc(p.name)}"></div><div class="field"><label>Profesión</label><input id="pubTrade" value="${esc(p.trade)}"></div><div class="field"><label>¿Qué servicios ofrecés?</label><textarea id="pubDesc" placeholder="Ej.: Reparaciones de pérdidas, griferías, instalaciones y mantenimiento."></textarea></div><div class="field"><label>Zona donde trabajás</label><input id="pubZone" value="${esc(p.zones||'Córdoba y zonas cercanas')}"></div><div class="field"><label>WhatsApp</label><input id="pubPhone" value="${esc(p.phone)}"></div><button class="btn primary" id="makePub">Crear publicación</button><div id="pubResult"></div></section>`;
  document.getElementById('back').onclick=()=>renderProvider(p);
  document.getElementById('makePub').onclick=async()=>{
    const name=document.getElementById('pubName').value.trim(),trade=document.getElementById('pubTrade').value.trim(),desc=document.getElementById('pubDesc').value.trim(),zone=document.getElementById('pubZone').value.trim(),phone=document.getElementById('pubPhone').value.trim();
    if(!name||!trade||!desc||!phone){alert('Completá nombre, profesión, servicios y WhatsApp.');return}
    const providerId=p.providerId||normPhone(phone);const publicUrl=`${location.origin}/#prof=${encodeURIComponent(providerId)}`;await updateDoc(providerRef(phone),{publicDescription:desc,publicZone:zone||'Córdoba',updatedAt:serverTimestamp()});const text=`🔧 ${name} · ${trade}\n\n${desc}\n\n📍 Zona: ${zone||'Córdoba'}\n\nEncontrame y solicitá el servicio a través de Necesito:\n${publicUrl}`;
    document.getElementById('pubResult').innerHTML=`<div class="title" style="font-size:17px;margin-top:18px">Vista previa</div><div class="publishPreview" id="pubText">${esc(text)}</div><div class="shareRow"><button class="btn greenBtn" id="sharePub">📤 Compartir</button><button class="btn light" id="copyPub">📋 Copiar texto</button></div><p class="muted small" style="margin-top:10px">El aviso no publica el WhatsApp del profesional: lleva a su ficha dentro de Necesito para que el contacto pase por la plataforma.</p>`;
    document.getElementById('sharePub').onclick=async()=>{try{if(navigator.share){await navigator.share({title:`${name} · ${trade}`,text})}else{await navigator.clipboard.writeText(text);alert('Texto copiado. Pegalo donde quieras publicarlo.')}}catch(e){if(e?.name!=='AbortError'){try{await navigator.clipboard.writeText(text);alert('Texto copiado. Pegalo donde quieras publicarlo.')}catch{alert('No se pudo abrir el menú de compartir.')}}}};
    document.getElementById('copyPub').onclick=async()=>{try{await navigator.clipboard.writeText(text);alert('Publicación copiada. Ahora podés pegarla en Facebook, WhatsApp o donde quieras.')}catch{alert('No se pudo copiar automáticamente. Seleccioná y copiá el texto de la vista previa.')}};
  };
}

async function publicProfile(id){clearWatch();window.__targetProviderId=id;try{const snap=await getDoc(doc(db,'providers',id));if(!snap.exists()){window.__targetProviderId='';root.innerHTML=`${nav()}<section class="card"><div class="status bad">No encontramos ese profesional.</div></section>`;return}const p=snap.data();root.innerHTML=`${nav()}<button class="back" id="back">← Volver</button><section class="card"><div class="title">${esc(p.name||'Profesional')}</div><div class="muted">${esc(p.trade||'')}</div>${p.publicDescription?`<p style="margin-top:14px">${esc(p.publicDescription)}</p>`:''}<div class="status blue small">📍 Zona: ${esc(p.publicZone||p.zones||'Córdoba')}</div><button class="btn greenBtn" id="requestPro">Solicitar a ${esc(p.name||'este profesional')}</button><p class="muted small" style="margin-top:10px">El contacto se realiza a través de Necesito. El número personal no se publica.</p></section>`;document.getElementById('back').onclick=home;document.getElementById('requestPro').onclick=()=>{window.__targetProviderId=id;client()}}catch(e){window.__targetProviderId='';root.innerHTML=`${nav()}<section class="card"><div class="status bad">No se pudo cargar el profesional.</div></section>`}}

function editPro(p){root.innerHTML=`<button class="back" id="back">← Volver</button><section class="card"><div class="title">Editar mis datos</div><div class="field"><label>Nombre</label><input id="pname" value="${esc(p.name)}"></div><div class="field"><label>WhatsApp</label><input id="pphone" value="${esc(p.phone)}"></div><div class="field"><label>Oficio</label>${tradeSelect('ptrade',p.trade)}</div><button class="btn primary" id="saveEdit">Guardar cambios</button></section>`;document.getElementById('back').onclick=providerPanel;document.getElementById('saveEdit').onclick=async()=>{p={...p,name:document.getElementById('pname').value.trim(),phone:document.getElementById('pphone').value.trim(),trade:document.getElementById('ptrade').value,zones:''};await setDoc(providerRef(p.phone),p,{merge:true});save(K.pro,p);providerPanel()}}
function watchProvider(p){clearWatch();stopProviderAlert();providerAlertPrimed=false;providerSeenRequests=new Set();if(!p.connected)return;const q=query(collection(db,'requests'),where('trade','==',p.trade),where('status','in',['searching','accepted']));const u=onSnapshot(q,s=>{const el=document.getElementById('requests');if(!el)return;const rows=s.docs.filter(d=>{const r=d.data(),pid=p.providerId||normPhone(p.phone);if(r.runId!==runId())return false;if(r.targetProviderId&&r.targetProviderId!==pid)return false;if(r.status==='accepted'&&r.providerId!==pid)return false;if(r.status==='accepted'&&r.providerClosed)return false;if((r.rejectedBy||[]).includes(pid))return false;return true});const searchingIds=new Set(rows.filter(d=>d.data().status==='searching').map(d=>d.id));if(providerAlertPrimed){let isNew=false;for(const id of searchingIds)if(!providerSeenRequests.has(id)){isNew=true;break}if(isNew)startProviderAlert(p.name)}else{providerAlertPrimed=true;if(searchingIds.size)startProviderAlert(p.name)}providerSeenRequests=searchingIds;if(!rows.some(d=>d.data().status==='searching'))stopProviderAlert();if(!rows.length){el.innerHTML='<span class="muted">🟢 Conectado · Esperando nuevas solicitudes.</span>';return}el.innerHTML=rows.map(d=>{const r=d.data();if(r.status==='accepted')return `<div class="item"><b>🟢 Solicitud aceptada</b><p style="margin:7px 0"><b>${esc(r.clientName)}</b><br>${esc(r.problem)}</p><button class="btn greenBtn" onclick="contact('${encodeURIComponent(r.clientPhone||'')}','${encodeURIComponent(r.clientName||'')}')">📱 Contactar a ${esc(r.clientName)}</button>${r.providerClosed?'<div class="status ok small">✓ Cierre registrado.</div>':`<div class="item" style="margin-top:10px"><b>Registrar cierre</b><div class="field"><label>Observación (opcional)</label><textarea id="po_${d.id}"></textarea></div><button class="btn greenBtn" onclick="closeProvider('${d.id}')">Cerrar operación</button></div>`}</div>`;return `<div class="item"><b>🔔 Nueva solicitud</b><p style="margin:7px 0"><b>${esc(r.clientName)}</b><br>${esc(r.problem)}</p><div class="row"><button class="btn greenBtn" onclick="accept('${d.id}')">Aceptar</button><button class="btn redBtn" onclick="reject('${d.id}')">Rechazar</button></div></div>`}).join('')},()=>{const el=document.getElementById('requests');if(el)el.innerHTML='<span class="muted">No se pudieron cargar las solicitudes.</span>'});stop.push(u)}
const accepting=new Set();window.accept=async id=>{if(accepting.has(id))return;accepting.add(id);const btn=document.querySelector(`button[onclick="accept('${id}')"]`);if(btn){btn.disabled=true;btn.textContent='Aceptando…';}try{const p=load(K.pro),providerId=p?.providerId||normPhone(p?.phone);await runTransaction(db,async tx=>{const ref=doc(db,'requests',id),s=await tx.get(ref);if(!s.exists()||s.data().status!=='searching')throw new Error('already');tx.update(ref,{status:'accepted',providerId,providerUid:uid,providerName:p?.name||'',providerPhone:p?.phone||''})});await providerPanel()}catch(e){if(e?.message==='already')alert('La solicitud ya fue aceptada por otro profesional.');else alert('No se pudo aceptar la solicitud. Intentá nuevamente.');await providerPanel()}finally{accepting.delete(id)}};
window.reject=async id=>{stopProviderAlert();const s=await getDoc(doc(db,'requests',id));if(!s.exists())return;const p=load(K.pro),providerId=p?.providerId||normPhone(p?.phone),a=[...(s.data().rejectedBy||[])];if(!a.includes(providerId))a.push(providerId);await updateDoc(doc(db,'requests',id),{rejectedBy:a})};
window.contact=(phone,name)=>{const n=normPhone(decodeURIComponent(phone));const p=load(K.pro);location.href='https://wa.me/'+n+'?text='+encodeURIComponent(`Hola ${decodeURIComponent(name)}, soy ${p?.name||'el profesional'}. Te contacto por tu solicitud en Necesito.`)};
window.closeProvider=async id=>{const obs=document.getElementById('po_'+id)?.value.trim()||'';const snap=await getDoc(doc(db,'requests',id));if(!snap.exists())return;const r=snap.data();const data={providerClosed:true,providerObservation:obs,providerClosedAt:serverTimestamp()};if(r.clientClosed)data.status='completed';await updateDoc(doc(db,'requests',id),data);providerPanel()};
function admin(){clearWatch();const pin=prompt('PIN de administración de prueba');if(pin!=='Necesito2026'){home();return}root.innerHTML=`${nav()}<button class="back" id="back">← Volver al inicio</button><section class="card"><div class="title">Administración</div><p class="muted small">Panel interno de prueba.</p><div class="title" style="font-size:17px;margin-top:15px">Profesionales</div><div id="pros">Cargando…</div></section><section class="card"><div class="title" style="font-size:17px">Solicitudes</div><div id="adminReq">Cargando…</div></section>`;document.getElementById('back').onclick=home;const u1=onSnapshot(collection(db,'providers'),s=>{const el=document.getElementById('pros');if(!el)return;el.innerHTML=s.docs.map(d=>{const p=d.data();return `<div class="item"><b>${esc(p.name||'Sin nombre')}</b> · ${esc(p.trade||'')}<br><span class="badge ${p.active===false?'bad':(p.connected?'ok':'bad')}">${p.active===false?'⚪ INACTIVO':(p.connected?'🟢 CONECTADO':'🔴 DESCONECTADO')}</span><br><span class="small">${esc(p.phone||'')}</span></div>`}).join('')||'Sin profesionales registrados.'});const u2=onSnapshot(collection(db,'requests'),s=>{const el=document.getElementById('adminReq');if(!el)return;el.innerHTML=s.docs.map(d=>{const r=d.data();return `<div class="item"><b>${esc(r.clientName||'')}</b> · ${esc(r.trade||'')}<br>${esc(r.problem||'')}<br>Estado: <b>${esc(r.status||'')}</b>${r.providerName?`<br>Profesional: ${esc(r.providerName)}`:''}${r.clientObservation?`<br>Obs. cliente: ${esc(r.clientObservation)}`:''}${r.providerObservation?`<br>Obs. profesional: ${esc(r.providerObservation)}`:''}</div>`}).join('')||'Sin solicitudes.'});stop.push(u1,u2)}
// Exponer las funciones de navegación porque este script usa type="module" y los onclick del HTML no acceden al scope del módulo.
Object.assign(window,{home,client,professional,admin,publicProfile,activity,favorites,menu});
async function start(){await signInAnonymously(auth)}onAuthStateChanged(auth,u=>{if(u){uid=u.uid;const m=location.hash.match(/^#prof=(.+)$/);if(m)publicProfile(decodeURIComponent(m[1]));else home()}});start().catch(()=>root.innerHTML='<section class="card"><div class="status bad">No se pudo conectar con Firebase.</div></section>');
</script></body></html>
