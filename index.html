<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><link rel="manifest" href="manifest.json"><title>Necesito</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#172033;--muted:#697386;--line:#e5e7eb;--green:#16803c;--greenbg:#eaf8ef;--red:#b42318;--redbg:#fff0ef;--blue:#3157d5;--bluebg:#eef2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:620px;margin:auto;min-height:100vh}.top{padding:20px 18px 10px}.brand{font-size:30px;font-weight:850;letter-spacing:-1px}.sub{color:var(--muted)}main{padding:8px 16px 30px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #00000008}.title{font-size:20px;font-weight:800;margin-bottom:6px}.muted{color:var(--muted)}.small{font-size:13px}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:7px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:95px}.btn{border:0;border-radius:13px;padding:13px 15px;font-weight:750;cursor:pointer}.primary{background:#172033;color:#fff;width:100%}.greenBtn{background:var(--green);color:#fff;width:100%}.redBtn{background:var(--red);color:#fff;width:100%}.light{background:#eef1f5;color:var(--ink)}.back{background:transparent;border:0;padding:4px 0;color:var(--muted);font-weight:700}.homeBtn{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:7px 0}.homeBtn b{display:block;font-size:17px}.homeBtn span{display:block;color:var(--muted);margin-top:3px}.status{padding:14px;border-radius:14px;margin:10px 0}.ok{background:var(--greenbg);color:var(--green)}.warn{background:#fff7e8;color:#9a5a00}.bad{background:var(--redbg);color:var(--red)}.blue{background:var(--bluebg);color:#2745a7}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.badge{display:inline-block;padding:6px 9px;border-radius:99px;font-size:12px;font-weight:800}.badge.ok{color:var(--green);background:var(--greenbg)}.badge.bad{color:var(--red);background:var(--redbg)}.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.footer{display:none}.hidden{display:none}
</style></head><body><div class="app"><header class="top"><div class="brand">Necesito</div><div class="sub">Encontrá a quien pueda resolverlo.</div></header><main id="app"></main></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,addDoc,getDoc,getDocs,updateDoc,onSnapshot,query,where,serverTimestamp,runTransaction} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js';
import firebaseConfig from './firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),root=document.getElementById('app');
let uid=null,stop=[]; const K={pro:'nec_pro',client:'nec_client',active:'nec_active'};
const normPhone=v=>{let n=String(v||'').replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('549'))return n;if(n.startsWith('54'))return '549'+n.slice(2).replace(/^9/,'');if(n.startsWith('0'))n=n.slice(1);return '549'+n};
const providerRef=phone=>doc(db,'providers',normPhone(phone));
const trades=['Plomero','Electricista','Gasista','Cerrajero','Técnico de aire acondicionado','Otro'];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function clearWatch(){stop.forEach(f=>{try{f()}catch{}});stop=[]}
function home(){clearWatch();const p=load(K.pro),a=load(K.active);root.innerHTML=`<section class="card"><h2 style="margin:0 0 5px">¿Qué necesitás?</h2><p class="muted">Te conectamos con quien pueda resolverlo.</p><button class="homeBtn" id="client"><b>🔎 Soy cliente</b><span>${a?'Tenés una solicitud activa. Continuar.':'Necesito algo o un servicio.'}</span></button><button class="homeBtn" id="pro"><b>🔧 Soy profesional</b><span>${p?esc(p.name)+' · '+(p.connected?'🟢 Conectado':'🔴 Desconectado'):'Quiero recibir solicitudes.'}</span></button></section>`;document.getElementById('client').onclick=client;document.getElementById('pro').onclick=professional}
function tradeSelect(id,val){return `<select id="${id}">${trades.map(t=>`<option ${t===val?'selected':''}>${t}</option>`).join('')}</select>`}
function client(){clearWatch();const c=load(K.client)||{},active=load(K.active);if(active){watchClient(active);return}root.innerHTML=`<button class="back" id="back">← Volver al inicio</button><section class="card"><div class="title">Necesito encontrar quién puede resolverlo</div><p class="muted small">Tus datos personales quedan guardados para la próxima vez. En cada pedido elegís qué necesitás y dónde.</p><div class="field"><label>¿Qué necesitás?</label>${tradeSelect('trade',c.trade||'Plomero')}</div><div class="field"><label>¿Dónde lo necesitás?</label><input id="zone" value="${esc(c.zone||'')}" placeholder="Ej. Argüello"></div><div class="field"><label>¿Qué necesitás solucionar o conseguir?</label><textarea id="problem" placeholder="Describí lo que estás buscando"></textarea></div><div class="field"><label>Tu nombre</label><input id="name" value="${esc(c.name||'')}" placeholder="Nombre"></div><div class="field"><label>Tu WhatsApp</label><input id="phone" value="${esc(c.phone||'')}" inputmode="tel" placeholder="351... o +54..."></div><button class="btn primary" id="send">Buscar profesional</button><div id="err" class="small muted" style="margin-top:10px"></div></section>`;document.getElementById('back').onclick=home;document.getElementById('send').onclick=createRequest}
async function createRequest(){const trade=document.getElementById('trade').value,zone=document.getElementById('zone').value.trim(),problem=document.getElementById('problem').value.trim(),name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),err=document.getElementById('err');if(!zone||!problem||!name||!phone){err.textContent='Completá zona, descripción, nombre y WhatsApp.';return}try{save(K.client,{name,phone,zone,trade});const r=await addDoc(collection(db,'requests'),{clientUid:uid,clientName:name,clientPhone:phone,trade,zone,problem,status:'searching',providerUid:null,providerName:null,providerPhone:null,rejectedBy:[],clientClosed:false,providerClosed:false,createdAt:serverTimestamp()});save(K.active,r.id);watchClient(r.id)}catch(e){console.error(e);err.textContent='No se pudo enviar la solicitud. Verificá la conexión.'}}
function watchClient(id){clearWatch();root.innerHTML=`<button class="back" id="homeBack">← Volver al inicio</button><section class="card"><div id="clientState"><div class="status warn"><b>🟠 Buscando profesional…</b><br><span class="small">Tu solicitud quedó guardada. Podés salir y volver sin perderla.</span></div></div></section>`;document.getElementById('homeBack').onclick=home;const u=onSnapshot(doc(db,'requests',id),s=>{if(!s.exists())return;renderClient(id,s.data())},()=>{const x=document.getElementById('clientState');if(x)x.innerHTML='<div class="status bad">No se pudo actualizar la solicitud.</div>'});stop.push(u)}
function renderClient(id,r){const x=document.getElementById('clientState');if(!x)return;let html='';if(r.status==='searching')html=`<div class="status warn"><b>🟠 Buscando profesional…</b><br><span class="small">La solicitud fue enviada y está esperando aceptación.</span></div>`;else if(r.status==='accepted')html=`<div class="status ok"><b>🟢 Solicitud aceptada</b><br><span class="small">${esc(r.providerName||'El profesional')} recibió tu solicitud y va a comunicarse con vos para coordinar el servicio.</span></div>`;else if(r.status==='completed')html=`<div class="status ok"><b>✓ Servicio cerrado</b><br><span class="small">La operación quedó registrada.</span></div>`;else html=`<div class="status bad"><b>Solicitud finalizada</b></div>`;html+=`<div class="item"><b>${esc(r.trade)}</b><br><span class="muted">${esc(r.zone)}</span><p style="margin:8px 0 0">${esc(r.problem)}</p></div>`;if(r.status==='accepted'&&!r.clientClosed)html+=closeBlock(id,'client');if(r.clientClosed)html+=`<div class="status ok small">✓ Registraste el cierre de tu parte por $${esc(r.clientAmount)}.</div>`;if(r.status==='completed')html+=`<button class="btn greenBtn" id="newReq">Nueva solicitud</button>`;x.innerHTML=html;if(document.getElementById('newReq'))document.getElementById('newReq').onclick=()=>{localStorage.removeItem(K.active);client()}}
function closeBlock(id,who){return `<div class="item"><b>Registrar cierre</b><div class="field"><label>${who==='client'?'¿Cuánto pagaste finalmente?':'¿Cuánto cobraste?'}</label><input id="amount_${who}" inputmode="numeric" placeholder="Ej. 50000"></div><div class="field"><label>Observación (opcional)</label><textarea id="obs_${who}" placeholder="Observación"></textarea></div><button class="btn greenBtn" id="close_${who}">Cerrar operación</button></div>`}
async function closeReq(id,who){const amount=document.getElementById('amount_'+who)?.value.trim(),obs=document.getElementById('obs_'+who)?.value.trim();if(!amount){alert('Ingresá el importe.');return}const ref=doc(db,'requests',id),snap=await getDoc(ref);if(!snap.exists())return;const r=snap.data();const data=who==='client'?{clientClosed:true,clientAmount:amount,clientObservation:obs,clientClosedAt:serverTimestamp()}:{providerClosed:true,providerAmount:amount,providerObservation:obs,providerClosedAt:serverTimestamp()};if((who==='client'&&r.providerClosed)||(who==='provider'&&r.clientClosed))data.status='completed';await updateDoc(ref,data);if(who==='client'){localStorage.removeItem(K.active);watchClient(id)}else providerPanel()}
document.addEventListener('click',e=>{if(e.target.id==='close_client'){const id=load(K.active);if(id)closeReq(id,'client')}});
async function professional(){clearWatch();const cached=load(K.pro);if(cached){const snap=await getDoc(providerRef(cached.phone));if(snap.exists()){const d=snap.data();save(K.pro,{...d,providerId:snap.id});return renderProvider({...d,providerId:snap.id})}}root.innerHTML=`<button class="back" id="back">← Volver al inicio</button><section class="card"><div class="title">Soy profesional</div><p class="muted small">Ingresá tu WhatsApp. Si ya tenés perfil, recuperamos tus datos. Si no, podés crear uno.</p><div class="field"><label>WhatsApp</label><input id="pphone" inputmode="tel" placeholder="351... o +54..."></div><button class="btn primary" id="find">Continuar</button><div id="proForm"></div></section>`;document.getElementById('back').onclick=home;document.getElementById('find').onclick=findOrCreatePro}
async function findOrCreatePro(){const phone=document.getElementById('pphone').value.trim();if(!phone){alert('Ingresá tu WhatsApp.');return}const ref=providerRef(phone),snap=await getDoc(ref);if(snap.exists()){const d=snap.data();save(K.pro,{...d,providerId:snap.id});providerPanel();return}
// Compatibilidad: buscar perfiles creados con la versión anterior (cuyo ID era el UID anónimo) y migrarlos al ID estable del WhatsApp.
let legacy=null;for(const candidate of [phone,normPhone(phone)]){const qs=await getDocs(query(collection(db,'providers'),where('phone','==',candidate)));if(!qs.empty){legacy=qs.docs[0];break}}
if(legacy){const d=legacy.data();if(d.phone){const migrated={...d,providerId:normPhone(phone),phone:d.phone,ownerUid:uid};await setDoc(ref,{...migrated,updatedAt:serverTimestamp()},{merge:true});save(K.pro,migrated);providerPanel();return}}
document.getElementById('find').style.display='none';document.getElementById('proForm').innerHTML=`<div class="field"><label>Nombre</label><input id="pname" placeholder="Nombre o nombre comercial"></div><div class="field"><label>Oficio</label>${tradeSelect('ptrade','Plomero')}</div><div class="field"><label>Zonas donde trabajás</label><input id="pzone" placeholder="Ej. Argüello, Villa Belgrano"></div><button class="btn primary" id="save">Crear perfil</button>`;document.getElementById('save').onclick=()=>savePro(phone)}
async function savePro(phone){const p={providerId:normPhone(phone),name:document.getElementById('pname').value.trim(),phone:phone.trim(),trade:document.getElementById('ptrade').value,zones:document.getElementById('pzone').value.trim(),connected:false,ownerUid:uid};if(!p.name||!p.phone||!p.zones){alert('Completá todos los datos.');return}await setDoc(providerRef(phone),{...p,updatedAt:serverTimestamp()},{merge:true});save(K.pro,p);providerPanel()}
async function providerPanel(){clearWatch();let p=load(K.pro);if(!p){professional();return}const snap=await getDoc(providerRef(p.phone));if(!snap.exists()){localStorage.removeItem(K.pro);professional();return}p={...snap.data(),providerId:snap.id};save(K.pro,p);renderProvider(p)}
function renderProvider(p){root.innerHTML=`<button class="back" id="back">← Volver al inicio</button><section class="card"><div class="title">Soy profesional</div><div style="font-size:18px;font-weight:800">${esc(p.name)}</div><div class="muted">${esc(p.trade)}</div><div style="margin-top:10px"><span class="badge ${p.connected?'ok':'bad'}">${p.connected?'🟢 CONECTADO':'🔴 DESCONECTADO'}</span></div><div class="row" style="margin-top:12px"><button class="btn ${p.connected?'redBtn':'greenBtn'}" id="toggle">${p.connected?'Desconectarme':'Conectarme'}</button><button class="btn light" id="edit">Editar datos</button></div></section><section class="card"><div class="title" style="font-size:17px">Solicitudes</div><div id="requests"><span class="muted">${p.connected?'Buscando solicitudes…':'Conectate para recibir solicitudes.'}</span></div></section>`;document.getElementById('back').onclick=home;document.getElementById('edit').onclick=()=>editPro(p);document.getElementById('toggle').onclick=async()=>{p.connected=!p.connected;await updateDoc(providerRef(p.phone),{connected:p.connected});save(K.pro,p);renderProvider(p)};watchProvider(p)}
function editPro(p){root.innerHTML=`<button class="back" id="back">← Volver</button><section class="card"><div class="title">Editar mis datos</div><div class="field"><label>Nombre</label><input id="pname" value="${esc(p.name)}"></div><div class="field"><label>WhatsApp</label><input id="pphone" value="${esc(p.phone)}"></div><div class="field"><label>Oficio</label>${tradeSelect('ptrade',p.trade)}</div><div class="field"><label>Zonas</label><input id="pzone" value="${esc(p.zones)}"></div><button class="btn primary" id="saveEdit">Guardar cambios</button></section>`;document.getElementById('back').onclick=providerPanel;document.getElementById('saveEdit').onclick=async()=>{p={...p,name:document.getElementById('pname').value.trim(),phone:document.getElementById('pphone').value.trim(),trade:document.getElementById('ptrade').value,zones:document.getElementById('pzone').value.trim()};await setDoc(providerRef(p.phone),p,{merge:true});save(K.pro,p);providerPanel()}}
function watchProvider(p){clearWatch();if(!p.connected)return;const q=query(collection(db,'requests'),where('trade','==',p.trade),where('status','in',['searching','accepted']));const u=onSnapshot(q,s=>{const el=document.getElementById('requests');if(!el)return;const rows=s.docs.filter(d=>{const r=d.data();if(r.status==='accepted'&&r.providerId!==(p.providerId||normPhone(p.phone)))return false;if(r.status==='accepted'&&r.providerClosed)return false;if((r.rejectedBy||[]).includes(p.providerId||normPhone(p.phone)))return false;const zs=(p.zones||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);return zs.some(z=>r.zone.toLowerCase().includes(z))});if(!rows.length){el.innerHTML='<span class="muted">🟢 Conectado · Esperando nuevas solicitudes.</span>';return}el.innerHTML=rows.map(d=>{const r=d.data();if(r.status==='accepted')return `<div class="item"><b>🟢 Solicitud aceptada</b><p style="margin:7px 0"><b>${esc(r.clientName)}</b><br>${esc(r.zone)}<br>${esc(r.problem)}</p><button class="btn greenBtn" onclick="contact('${encodeURIComponent(r.clientPhone||'')}','${encodeURIComponent(r.clientName||'')}')">📱 Contactar a ${esc(r.clientName)}</button>${r.providerClosed?'<div class="status ok small">✓ Cierre registrado.</div>':`<div class="item" style="margin-top:10px"><b>Registrar cierre</b><div class="field"><label>¿Cuánto cobraste?</label><input id="pa_${d.id}" inputmode="numeric" placeholder="Ej. 50000"></div><div class="field"><label>Observación (opcional)</label><textarea id="po_${d.id}"></textarea></div><button class="btn greenBtn" onclick="closeProvider('${d.id}')">Cerrar operación</button></div>`}</div>`;return `<div class="item"><b>Solicitud de ${esc(r.clientName)}</b><p style="margin:7px 0">${esc(r.zone)}<br>${esc(r.problem)}</p><div class="row"><button class="btn greenBtn" onclick="accept('${d.id}')">Aceptar</button><button class="btn redBtn" onclick="reject('${d.id}')">Rechazar</button></div></div>`}).join('')},()=>{const el=document.getElementById('requests');if(el)el.innerHTML='<span class="muted">No se pudieron cargar las solicitudes.</span>'});stop.push(u)}
window.accept=async id=>{try{const p=load(K.pro),providerId=p?.providerId||normPhone(p?.phone);await runTransaction(db,async tx=>{const ref=doc(db,'requests',id),s=await tx.get(ref);if(!s.exists()||s.data().status!=='searching')throw new Error();tx.update(ref,{status:'accepted',providerId,providerUid:uid,providerName:p?.name||'',providerPhone:p?.phone||''})});providerPanel()}catch{alert('La solicitud ya fue aceptada por otro profesional.')}};
window.reject=async id=>{const s=await getDoc(doc(db,'requests',id));if(!s.exists())return;const p=load(K.pro),providerId=p?.providerId||normPhone(p?.phone),a=[...(s.data().rejectedBy||[])];if(!a.includes(providerId))a.push(providerId);await updateDoc(doc(db,'requests',id),{rejectedBy:a})};
window.contact=(phone,name)=>{const n=decodeURIComponent(phone).replace(/\D/g,'');const p=load(K.pro);location.href='https://wa.me/'+n+'?text='+encodeURIComponent(`Hola ${decodeURIComponent(name)}, soy ${p?.name||'el profesional'}. Te contacto por tu solicitud en Necesito.`)};
window.closeProvider=async id=>{const amount=document.getElementById('pa_'+id)?.value.trim(),obs=document.getElementById('po_'+id)?.value.trim();if(!amount){alert('Ingresá el importe.');return}await updateDoc(doc(db,'requests',id),{providerClosed:true,providerAmount:amount,providerObservation:obs,providerClosedAt:serverTimestamp()});providerPanel()};
function admin(){clearWatch();root.innerHTML='<button class="back" id="back">← Volver</button><section class="card"><div class="title">Administración</div><p class="muted">Acceso interno de prueba.</p><div id="admin">Cargando…</div></section>';document.getElementById('back').onclick=home;const u=onSnapshot(collection(db,'requests'),s=>{document.getElementById('admin').innerHTML=s.docs.map(d=>{const r=d.data();return `<div class="item"><b>${esc(r.clientName||'')}</b> · ${esc(r.trade||'')}<br>${esc(r.problem||'')}<br>Estado: ${esc(r.status||'')}</div>`}).join('')||'Sin solicitudes.'});stop.push(u)}
async function start(){await signInAnonymously(auth)}onAuthStateChanged(auth,u=>{if(u){uid=u.uid;home()}});start().catch(()=>root.innerHTML='<section class="card"><div class="status bad">No se pudo conectar con Firebase.</div></section>');
</script></body></html>
