<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Necesito</title><style>
body{font-family:system-ui;margin:0;background:#f4f6f9;color:#172033}.wrap{max-width:650px;margin:auto;padding:16px}.hero,.card{border-radius:20px;padding:20px;margin:12px 0}.hero{background:#111827;color:#fff}.card{background:#fff;box-shadow:0 4px 16px #0001}h1{margin:0 0 5px}label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d5dae3;border-radius:11px;font-size:16px}textarea{min-height:90px}button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:800;margin-top:12px}.primary{background:#2563eb;color:#fff}.dark{background:#111827;color:#fff}.secondary{background:#e5e7eb}.status{padding:13px;border-radius:12px;margin-top:12px}.ok{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.req{border:1px solid #dce1e9;border-radius:12px;padding:12px;margin-top:10px}.muted{color:#667085}
</style></head><body><div class="wrap"><div class="hero"><h1>Necesito</h1><div>Prueba real con Firebase · dos teléfonos</div></div>
<section id="home" class="card"><h2>Entrar</h2><div class="grid"><button class="primary" onclick="show('client')">🔎 Soy cliente</button><button class="dark" onclick="show('pro')">🔧 Soy profesional</button></div><div id="conn" class="status wait">Conectando…</div></section>
<section id="client" class="card hidden"><h2>🔎 Solicitar profesional</h2><label>Oficio</label><select id="ct"><option>Plomero</option><option>Electricista</option><option>Gasista</option><option>Cerrajero</option></select><label>Zona</label><input id="cz"><label>Problema</label><textarea id="cp"></textarea><label>Nombre</label><input id="cn"><label>WhatsApp</label><input id="cw"><button class="primary" id="send">Solicitar profesional</button><div id="cs"></div><button class="secondary" onclick="show('home')">Volver</button></section>
<section id="pro" class="card hidden"><h2>🔧 Profesional</h2><label>Nombre</label><input id="pn"><label>WhatsApp</label><input id="pw"><label>Oficio</label><select id="pt"><option>Plomero</option><option>Electricista</option><option>Gasista</option><option>Cerrajero</option></select><label>Zona habitual</label><input id="pz"><button class="primary" id="save">Guardar y conectarme</button><div id="ps"></div><div id="panel" class="hidden"><button class="secondary" id="toggle">Desconectarme</button><h3>Solicitudes pendientes</h3><div id="reqs"></div></div><button class="secondary" onclick="show('home')">Volver</button></section></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";import{getFirestore,collection,addDoc,doc,setDoc,getDoc,query,where,onSnapshot,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";const firebaseConfig = {
  apiKey: "AIzaSyCkVS-1fNPd-tDo9M35QZ0zKFcvp-O5EGA",
  authDomain: "necesito-b88b6.firebaseapp.com",
  projectId: "necesito-b88b6",
  storageBucket: "necesito-b88b6.firebasestorage.app",
  messagingSenderId: "129780156572",
  appId: "1:129780156572:web:2c94c445cf8bca75520559"
};


const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let uid=null,unsubReq=null,unsubClient=null;const $=x=>document.getElementById(x);window.show=x=>['home','client','pro'].forEach(y=>$(y).classList.toggle('hidden',x!==y));const status=(id,t,c='status')=>$(id).innerHTML=`<div class="${c}">${t}</div>`;
signInAnonymously(auth).catch(e=>status('conn','🔴 Error de conexión. Revisá Authentication → Anónimo.','status bad'));onAuthStateChanged(auth,u=>{if(u){uid=u.uid;status('conn','🟢 Firebase conectado en tiempo real','status ok')}});
$('send').onclick=async()=>{if(!uid)return alert('Esperá la conexión con Firebase.');let d={clientUid:uid,clientName:$('cn').value.trim(),clientPhone:$('cw').value.trim(),trade:$('ct').value,zone:$('cz').value.trim(),problem:$('cp').value.trim(),status:'searching',createdAt:serverTimestamp()};if(!d.clientName||!d.clientPhone||!d.zone||!d.problem)return alert('Completá todos los campos.');let r=await addDoc(collection(db,'requests'),d);status('cs','🟡 Solicitud enviada. Esperando profesional…','status wait');if(unsubClient)unsubClient();unsubClient=onSnapshot(doc(db,'requests',r.id),s=>{let x=s.data();if(x?.status==='accepted')status('cs',`🟢 <b>Profesional encontrado:</b> ${x.providerName}<br><button class="primary" onclick="wa('${(x.providerPhone||'').replace(/\D/g,'')}')">Enviar mensaje al profesional</button>`,'status ok')});};
window.wa=p=>{if(!p)return alert('El profesional no cargó WhatsApp.');open(`https://wa.me/${p}?text=${encodeURIComponent('Hola, te contacto desde Necesito. Necesito ayuda con un trabajo.')}`,'_blank')};
$('save').onclick=async()=>{if(!uid)return alert('Esperá la conexión.');let d={name:$('pn').value.trim(),phone:$('pw').value.trim(),trade:$('pt').value,zone:$('pz').value.trim(),connected:true,updatedAt:serverTimestamp()};if(!d.name||!d.phone||!d.zone)return alert('Completá todos los campos.');await setDoc(doc(db,'providers',uid),d,{merge:true});status('ps','🟢 Profesional guardado y conectado.','status ok');$('panel').classList.remove('hidden');listen();};
function listen(){if(unsubReq)unsubReq();let q=query(collection(db,'requests'),where('trade','==',$('pt').value),where('status','==','searching'));unsubReq=onSnapshot(q,async s=>{let p=await getDoc(doc(db,'providers',uid)),connected=p.exists()&&p.data().connected;$('reqs').innerHTML=connected?s.docs.map(x=>{let r=x.data();return`<div class="req"><b>${r.trade}</b> · ${r.zone}<p>${r.clientName}: ${r.problem}</p><button class="primary" onclick="accept('${x.id}')">Aceptar solicitud</button><button class="secondary" onclick="reject('${x.id}')">Rechazar</button></div>`}).join('')||'<p class="muted">No hay solicitudes.</p>':'<p class="muted">Estás desconectado.</p>'});}
window.accept=async id=>{let p=await getDoc(doc(db,'providers',uid));let r=await getDoc(doc(db,'requests',id));if(!p.exists()||!p.data().connected||!r.exists()||r.data().status!=='searching')return alert('La solicitud ya no está disponible.');await updateDoc(doc(db,'requests',id),{status:'accepted',acceptedBy:uid,providerName:p.data().name,providerPhone:p.data().phone,acceptedAt:serverTimestamp()});};window.reject=async id=>{await updateDoc(doc(db,'requests',id),{status:'rejected',rejectedBy:uid,updatedAt:serverTimestamp()})};
$('toggle').onclick=async()=>{let r=doc(db,'providers',uid),p=await getDoc(r),v=p.data().connected;await updateDoc(r,{connected:!v,updatedAt:serverTimestamp()});$('toggle').textContent=v?'Conectarme':'Desconectarme';listen()};
</script></body></html>
